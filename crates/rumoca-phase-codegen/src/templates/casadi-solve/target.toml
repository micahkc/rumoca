version = 1
ir = "solve"
name = "casadi-solve"
description = "CasADi explicit ODE rhs(x, u, p) from the solve IR"
execution_mode = "symbolic"
deployment_class = "symbolic"

[capabilities]
scalar_fallback = true
events = false
runtime_events = false
forward_ad = false
reverse_ad = false
dynamic_control_flow = false
host_callbacks = false

[capabilities.tensor]
matmul = "native"
linsolve = "scalar"
layout = "row-major"
supports_dynamic_shapes = false
sparse = false
dtypes = ["f64"]

[[files]]
path = "{{ model_name }}_casadi_solve.py"
template = "casadi_solve.py.jinja"
